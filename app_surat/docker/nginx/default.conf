server {
    listen 80;
    server_name _;

    root /var/www;
    index index.php index.html;

    client_max_body_size 50M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
        try_files $uri =404;
    }

    location ^~ /app_surat/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name surat-test.pta-bandung.go.id;

    root /var/www;
    index index.php index.html;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/surat-test.pta-bandung.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surat-test.pta-bandung.go.id/privkey.pem;

    location ^~ /app_surat/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www;
    }

    location ~ /\. {
        deny all;
    }
}
