services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: app_surat_app

    working_dir: /var/www/app_surat

    volumes:
      - ../:/var/www

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    container_name: app_surat_nginx

    ports:
      - "8080:80"

    volumes:
      - ../:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    restart: unless-stopped


  db:
    image: mysql:8.0-debian

    container_name: app_surat_db

    environment:
      MYSQL_DATABASE: dbsurat
      MYSQL_USER: app_surat
      MYSQL_PASSWORD: app_surat_password
      MYSQL_ROOT_PASSWORD: root_password

    volumes:
      - db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  db_data: